[project]
name = "gmail-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # mcp 2 renamed FastMCP to mcp.server.mcpserver.MCPServer; servers are
    # written against it. <3 keeps the next major from arriving on a rebuild.
    "mcp>=2.3,<3",
    "google-api-python-client>=2.140",
    "google-auth>=2.33",
    "google-auth-oauthlib>=1.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest-asyncio>=0.24",
]

[project.scripts]
gmail-mcp = "gmail_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gmail_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
